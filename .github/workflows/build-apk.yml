name: Build IQ4YOU Renewals APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project
        run: |
          mkdir build-src
          unzip -q iq4you-renewals-cloud-build-ready.zip -d build-src

      - name: Build APK
        working-directory: build-src
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IQ4YOU-Renewals-APK
          path: build-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
